<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Archive</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#172b3a;--mut:#627789;--line:#dce6ec;--acc:#246b91;--hov:#eef6fa}
:root[data-t=dark]{--bg:#0e1621;--card:#16222f;--ink:#e6eef5;--mut:#8ea3b3;--line:#27384a;--acc:#5db3d8;--hov:#1c2c3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;cursor:pointer;white-space:nowrap}input,button,textarea{font:inherit;color:inherit}
#q{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}button:hover{background:var(--hov)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:960px;margin:0 auto;padding:18px 14px 60px}.crumbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;color:var(--mut)}.crumbs a{color:var(--acc);cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}h3{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}.row:hover{background:var(--hov)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis}.i{font-size:1.4rem}.row button{padding:3px 8px}
.msg{padding:30px;text-align:center;color:var(--mut)}.err{color:#c0392b}
.vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.vh h2{flex:1;margin:0;font-size:1.1rem;min-width:140px}
iframe.v{width:100%;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);border-radius:12px;background:#fff}
pre{white-space:pre-wrap;background:var(--card);padding:14px;border:1px solid var(--line);border-radius:12px}img.v{max-width:100%}
dialog{width:min(900px,94vw);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}dialog textarea{width:100%;height:60vh;font:13px/1.4 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:9}
@media(max-width:600px){.logo span{display:none}}
</style></head><body>
<header><div class="logo" onclick="go('b','')">🎓<span> Academic Archive</span></div><input id="q" type="search" placeholder="Search folders and files…" oninput="search(this.value)">
<button id="tb" title="Theme" onclick="theme()">🌓</button><button id="ab" onclick="admin()">🔐</button></header>
<main id="main"></main><div id="toast"></div>
<dialog id="dlg"><b id="dt"></b><p><textarea id="ta" spellcheck="false"></textarea></p><button class="pri" id="ds">Publish to GitHub</button> <button onclick="dlg.close()">Cancel</button></dialog>
<script>
const $=s=>document.querySelector(s),dlg=$('#dlg');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],tok=sessionStorage.t||'',fav=JSON.parse(localStorage.fav||'[]'),rec=JSON.parse(localStorage.rec||'[]'),cur='';
const keep=()=>{localStorage.fav=JSON.stringify(fav);localStorage.rec=JSON.stringify(rec)};
const ext=p=>p.split('.').pop().toLowerCase(),base=p=>p.split('/').pop(),par=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'';
const ICO={html:'📄',htm:'📄',pdf:'📕',md:'📝',txt:'📝',png:'🖼️',jpg:'🖼️',jpeg:'🖼️',gif:'🖼️',webp:'🖼️',doc:'📘',docx:'📘',ppt:'📙',pptx:'📙',xls:'📗',xlsx:'📗'};
const ico=i=>i.type==='dir'?'📁':ICO[ext(i.path)]||'📎';
const nice=i=>i.type==='dir'?base(i.path):base(i.path).replace(/\.(html?|pdf|md|txt)$/i,'').replace(/[-_]+/g,' ');
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok){let m;try{m=(await r.json()).error}catch{}throw new Error(m||'Error '+r.status)}return r};
function theme(){const d=document.documentElement,n=d.dataset.t==='dark'?'light':'dark';d.dataset.t=n;localStorage.theme=n}
document.documentElement.dataset.t=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
async function load(fresh){try{items=(await(await api('/api/tree'+(fresh?'?fresh=1':''))).json()).items;return true}
 catch(e){$('#main').innerHTML=`<div class="msg err">Could not load the archive: ${esc(e.message)}<p><button onclick="init()">Retry</button></p></div>`;return false}}
const go=(k,p)=>{history.pushState(0,'',`/${k}/${enc(p)}`);$('#q').value='';route()};
window.onpopstate=route;
function route(){const m=decodeURIComponent(location.pathname).match(/^\/(v|b)\/(.*)$/);const p=m?m[2].replace(/\/$/,''):'';
 m&&m[1]==='v'?view(p):browse(p);scrollTo(0,0)}
const crumbs=p=>{const s=p.split('/').filter(Boolean);return `<div class="crumbs"><a onclick="go('b','')">Home</a>`+s.map((x,i)=>{const q=s.slice(0,i+1).join('/');return ` / ${i===s.length-1&&0?esc(x):`<a onclick="go('b','${esc(q).replace(/'/g,"\\'")}')">${esc(x)}</a>`}`}).join('')+'</div>'};
const A=()=>tok?1:0;
function row(i,showPath){const q=esc(i.path).replace(/'/g,"\\'");
 return `<div class="row" onclick="go('${i.type==='dir'?'b':'v'}','${q}')"><span class="i">${ico(i)}</span><span class="n">${esc(nice(i))}${showPath?`<small>${esc(par(i.path)||'/')}</small>`:''}</span>`+
 (i.type==='file'?`<button title="Favorite" onclick="event.stopPropagation();fv('${q}')">${fav.includes(i.path)?'★':'☆'}</button>`:'')+
 (A()&&!showPath?`<button title="Rename" onclick="event.stopPropagation();ren('${q}')">✏️</button><button title="Delete" onclick="event.stopPropagation();del('${q}')">🗑</button>`:'')+`</div>`}
function browse(p){cur=p;const kids=items.filter(i=>par(i.path)===p).sort((a,b)=>(a.type<b.type?-1:a.type>b.type?1:0)||base(a.path).localeCompare(base(b.path),undefined,{numeric:true}));
 if(p&&!items.some(i=>i.path===p&&i.type==='dir')){$('#main').innerHTML=crumbs(p)+'<div class="msg">Folder not found.</div>';return}
 const bag=l=>l.map(x=>items.find(i=>i.path===x)).filter(Boolean);
 let h=crumbs(p);
 if(A())h+=`<div class="bar"><button onclick="mk()">＋ Folder</button><button onclick="nw()">＋ New HTML</button><button onclick="$('#up').click()">⬆ Upload files</button><input id="up" type="file" multiple hidden onchange="upl(this.files)"></div>`;
 h+=kids.length?kids.map(i=>row(i)).join(''):'<div class="msg">This folder is empty.</div>';
 if(!p){const f=bag(fav),r=bag(rec);if(f.length)h+='<h3>★ Favorites</h3>'+f.map(i=>row(i,1)).join('');if(r.length)h+='<h3>Recently opened</h3>'+r.map(i=>row(i,1)).join('')}
 $('#main').innerHTML=h}
async function view(p){cur=p;const it=items.find(i=>i.path===p);
 if(!it){$('#main').innerHTML=crumbs(par(p))+'<div class="msg">File not found.</div>';return}
 rec=[p,...rec.filter(x=>x!==p)].slice(0,12);keep();const e=ext(p),url='/api/file?path='+encodeURIComponent(p);
 $('#main').innerHTML=crumbs(par(p))+`<div class="vh"><h2>${ico(it)} ${esc(nice(it))}</h2><button onclick="fv('${esc(p).replace(/'/g,"\\'")}',1)">${fav.includes(p)?'★':'☆'} Favorite</button><button onclick="navigator.clipboard.writeText(location.href).then(()=>toast('Link copied'))">🔗 Copy link</button><a href="${url}&dl=1"><button>⬇ Download</button></a>${A()&&/^html?$|^txt$|^md$/.test(e)?`<button onclick="edit()">✎ Edit</button>`:''}</div><div id="vb" class="msg">Loading…</div>`;
 try{const r=await api(url+(tok?'&fresh=1':''));const vb=$('#vb');vb.className='';
  if(/^html?$/.test(e)){vb.innerHTML='<iframe class="v" sandbox="allow-scripts allow-forms allow-popups"></iframe>';vb.firstChild.srcdoc=await r.text()}
  else if(e==='pdf'){vb.innerHTML=`<iframe class="v" src="${URL.createObjectURL(await r.blob())}"></iframe>`}
  else if(/^(png|jpe?g|gif|webp)$/.test(e)){vb.innerHTML=`<img class="v" src="${URL.createObjectURL(await r.blob())}">`}
  else if(/^(txt|md)$/.test(e)){vb.innerHTML='<pre></pre>';vb.firstChild.textContent=await r.text()}
  else vb.innerHTML='<div class="msg">No preview for this file type. Use Download.</div>'
 }catch(x){$('#vb').className='msg err';$('#vb').textContent='Could not open file: '+x.message}}
function fv(p,v){fav=fav.includes(p)?fav.filter(x=>x!==p):[p,...fav];keep();v?view(p):route()}
function search(v){v=v.trim().toLowerCase();if(!v)return route();const w=v.split(/\s+/);
 const r=items.filter(i=>w.every(x=>i.path.toLowerCase().includes(x))).slice(0,100);
 $('#main').innerHTML=`<h3>${r.length} result${r.length===1?'':'s'}</h3>`+r.map(i=>row(i,1)).join('')}
// ---- admin (all writes go through /api/admin; GitHub token never reaches the browser)
function upd(){$('#ab').textContent=tok?'🔓 Admin':'🔐'}
async function admin(){if(tok){if(confirm('Sign out of admin mode?')){tok='';sessionStorage.removeItem('t');upd();route()}return}
 const password=prompt('Admin password');if(!password)return;
 try{tok=(await(await api('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password})})).json()).token;sessionStorage.t=tok;upd();route();toast('Admin mode on')}catch(e){alert(e.message)}}
async function adm(b,ok){try{await api('/api/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-token':tok},body:JSON.stringify(b)});toast(ok||'Published to GitHub');await load(1);route()}
 catch(e){if(/Unauthorized/.test(e.message)){tok='';sessionStorage.removeItem('t');upd()}alert(e.message)}}
const join=(a,b)=>a?a+'/'+b:b;
const mk=()=>{const n=prompt('New folder name (e.g. CC4, 1ST SEM, reviewers)');n&&adm({action:'mkdir',path:join(cur,n.trim())},'Folder created')};
const del=p=>confirm(`Delete "${p}" and everything inside it? This commits to GitHub.`)&&adm({action:'delete',path:p},'Deleted');
const ren=p=>{const n=prompt('New name',base(p));n&&n!==base(p)&&adm({action:'rename',from:p,to:join(par(p),n.trim())},'Renamed')};
const b64=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.onerror=j;x.readAsDataURL(f)});
async function upl(fs){for(const f of fs){if(f.size>3e6){alert(f.name+' is over 3 MB. Add large files directly on GitHub.');continue}
 toast('Uploading '+f.name+'…');await adm({action:'put',path:join(cur,f.name),content:await b64(f)},'Uploaded '+f.name)}}
function editor(path,text){$('#dt').textContent=path;$('#ta').value=text;$('#ds').onclick=async()=>{dlg.close();await adm({action:'put',path,content:btoa(unescape(encodeURIComponent($('#ta').value)))},'Published');}; dlg.showModal()}
async function edit(){try{editor(cur,await(await api('/api/file?fresh=1&path='+encodeURIComponent(cur))).text())}catch(e){alert(e.message)}}
const nw=()=>{let n=prompt('File name (e.g. lesson-3.html)');if(!n)return;if(!/\.\w+$/.test(n))n+='.html';editor(join(cur,n.trim()),'<!doctype html>\n<html><head><meta charset="utf-8"><title>Reviewer</title></head>\n<body>\n\n</body></html>')};
async function init(){$('#main').innerHTML='<div class="msg">Loading archive…</div>';upd();if(await load())route()}
init();
</script></body></html>
